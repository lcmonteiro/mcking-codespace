[project]
name = "chatlib"
version = "0.1.0"
description = "A simple chat client library based on Textual"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Mcking", email = "mcking@openclaw.ai"}
]
dependencies = [
    "textual>=0.45.0",
]

[project.urls]
Homepage = "https://github.com/lcmonteiro/mcking-codespace"

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["chatlib*"]

[tool.setuptools.package-data]
chatlib = ["py.typed"]