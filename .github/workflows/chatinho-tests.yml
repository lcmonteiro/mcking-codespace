name: chatinho tests

on:
  push:
    branches: ["master"]
    paths: ["python/chatinho/**", ".github/workflows/chatinho-tests.yml"]
  pull_request:
    paths: ["python/chatinho/**", ".github/workflows/chatinho-tests.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python/chatinho
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests examples

      - name: Type check
        run: mypy src/chatinho

      - name: Test
        run: pytest -q
